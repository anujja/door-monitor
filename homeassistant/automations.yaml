# =============================================================================
# Door Monitor — sample Home Assistant automations
# Add to automations.yaml (UI: Settings ▸ Automations ▸ ⋮ ▸ Edit in YAML).
# These use either the rest_command services (configuration.yaml) or MQTT.
# =============================================================================

# 1) Wake the tablet and show the front-door camera when motion is detected.
- alias: "Tablet — wake on front door motion"
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door_motion
      to: "on"
  action:
    - service: rest_command.doormonitor_wake_temporary
      data:
        seconds: 45
    - service: rest_command.doormonitor_show_camera
      data:
        camera_id: front_door
  mode: restart

# 2) Doorbell press → wake + doorbell camera + brighten.
- alias: "Tablet — doorbell press"
  trigger:
    - platform: state
      entity_id: binary_sensor.doorbell_button
      to: "on"
  action:
    - service: rest_command.doormonitor_brightness
      data:
        value: 255
    - service: rest_command.doormonitor_doorbell_event
  mode: restart

# 3) Equivalent doorbell wake using MQTT instead of the HTTP API.
- alias: "Tablet — doorbell via MQTT"
  trigger:
    - platform: state
      entity_id: binary_sensor.doorbell_button
      to: "on"
  action:
    - service: mqtt.publish
      data:
        topic: "doormonitor/command/doorbell"
        payload: "press"
  mode: restart

# 4) Night mode: dim and sleep the screen at 23:00.
- alias: "Tablet — night sleep"
  trigger:
    - platform: time
      at: "23:00:00"
  action:
    - service: rest_command.doormonitor_screen_off
  mode: single

# 5) Morning: wake and brighten at 06:30.
- alias: "Tablet — morning wake"
  trigger:
    - platform: time
      at: "06:30:00"
  action:
    - service: rest_command.doormonitor_screen_on
    - service: rest_command.doormonitor_brightness
      data:
        value: 200
  mode: single

# 6) Battery protection: cut power to a smart plug when Door Monitor reports the
#    high-battery warning (battery stuck high for too long), restore at 70%.
- alias: "Tablet — stop charging when full too long"
  trigger:
    - platform: state
      entity_id: binary_sensor.door_monitor_battery_high_warning
      to: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tablet_charger_plug
  mode: single

- alias: "Tablet — resume charging at 70%"
  trigger:
    - platform: numeric_state
      entity_id: sensor.door_monitor_battery
      below: 70
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.tablet_charger_plug
  mode: single

# 7) Also reacts to the outbound HA event the app fires for the battery warning.
- alias: "Tablet — battery warning event"
  trigger:
    - platform: event
      event_type: door_monitor_battery_warning
  condition:
    - condition: template
      value_template: "{{ trigger.event.data.active }}"
  action:
    - service: notify.mobile_app_phone
      data:
        title: "Wall tablet battery"
        message: "Battery has been highly charged for a long time."
  mode: single

# 8) Reload the dashboard after a Home Assistant restart.
- alias: "Tablet — reload dashboard on HA start"
  trigger:
    - platform: homeassistant
      event: start
  action:
    - delay: "00:00:30"
    - service: rest_command.doormonitor_reload
  mode: single

# 9) MyGate visitor at the gate → phone notification with Approve / Deny buttons.
#    The MyGate integration (custom_components/mygate) publishes MyGate's alerts to MQTT, and
#    the tablet already shows them itself (chime + card + 30 s wake). This adds the phone,
#    where a button press answers the visitor through mygate.respond. The notification is
#    cleared once the visitor is answered (here or elsewhere) or times out.
- alias: "Tablet — MyGate visitor, ask on phone"
  trigger:
    - platform: mqtt
      topic: "doormonitor/mygate/notification"
  condition:
    - condition: template
      value_template: >-
        {{ trigger.payload_json.event_type == 'approval'
           and not trigger.payload_json.update }}
  action:
    - service: notify.mobile_app_phone
      data:
        title: "{{ trigger.payload_json.title }}"
        message: "{{ trigger.payload_json.text }}"
        data:
          tag: "mygate-{{ trigger.payload_json.id }}"
          actions:
            - action: "MYGATE_APPROVE_{{ trigger.payload_json.id }}"
              title: Approve
            - action: "MYGATE_DENY_{{ trigger.payload_json.id }}"
              title: Deny
  mode: queued

- alias: "Phone — answer MyGate visitor"
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
  condition:
    - condition: template
      value_template: "{{ trigger.event.data.action.startswith('MYGATE_') }}"
  action:
    - service: mygate.respond
      data:
        action: "{{ trigger.event.data.action.split('_')[1] | lower }}"
        id: "{{ trigger.event.data.action.split('_', 2)[2] }}"
  mode: queued

- alias: "Phone — clear answered MyGate visitor"
  trigger:
    - platform: mqtt
      topic: "doormonitor/mygate/notification_removed"
  action:
    - service: notify.mobile_app_phone
      data:
        message: clear_notification
        data:
          tag: "mygate-{{ trigger.payload_json.id }}"
  mode: queued

# 10) School bus (Roo Commuter integration): full-screen bus map on the tablet during a trip.
#     The tablet switches to a dedicated panel "bus map" dashboard (`/roo-bus`) while the child's
#     pickup/drop is active, keeps the screen on, and returns to the normal dashboard at trip end.
#     HA sections dashboards cap card width, so the full-screen map lives in a panel view the
#     tablet navigates to. Replace the entity ids with your own.
- alias: "Tablet — show the bus map while en route"
  trigger:
    - platform: state
      entity_id: binary_sensor.kabir_jain_s_bus_en_route
      to: "on"
      id: start
    - platform: state
      entity_id: binary_sensor.kabir_jain_s_bus_en_route
      from: "on"
      to: "off"
      id: end
  action:
    - choose:
        - conditions: [{ condition: trigger, id: start }]
          sequence:
            - service: mqtt.publish
              data: { topic: "doormonitor/command/wake", payload: "" }
            - service: mqtt.publish
              data: { topic: "doormonitor/command/navigate", payload: "/roo-bus" }
        - conditions: [{ condition: trigger, id: end }]
          sequence:
            - service: mqtt.publish
              data: { topic: "doormonitor/command/navigate", payload: "/lovelace" }
            - service: mqtt.publish
              data: { topic: "doormonitor/command/sleep", payload: "" }
  mode: queued

# 11) Keep the tablet screen on through the whole trip: if anything (doorbell, person timeout)
#     sleeps it while en route, wake it again.
- alias: "Tablet — hold screen on during the bus trip"
  trigger:
    - platform: state
      entity_id: switch.door_monitor_doormonitor_screen
      to: "off"
  condition:
    - condition: state
      entity_id: binary_sensor.kabir_jain_s_bus_en_route
      state: "on"
  action:
    - service: mqtt.publish
      data: { topic: "doormonitor/command/wake", payload: "" }
  mode: single

# 12) During a trip, when the person at the door has gone, close the doorbell camera so the
#     tablet returns to the bus map (needs the `command/dashboard` support in the app).
- alias: "Tablet — close doorbell camera during a trip"
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door_person
      from: "on"
      to: "off"
      for: "00:00:15"
  condition:
    - condition: state
      entity_id: binary_sensor.kabir_jain_s_bus_en_route
      state: "on"
  action:
    - service: mqtt.publish
      data: { topic: "doormonitor/command/dashboard", payload: "" }
  mode: single
